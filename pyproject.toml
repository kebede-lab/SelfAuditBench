[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfauditbench"
version = "0.1.0"
description = "Benchmarking auditable self-restriction in tool-using agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "SelfAuditBench contributors" }]
dependencies = [
  "openai>=2.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
agentforesight = [
  "pandas>=2.0",
  "pyarrow>=15.0",
]
figures = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.scripts]
selfauditbench = "selfauditbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
