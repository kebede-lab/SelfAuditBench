run_id: asb-full-gold-qwen35-sidecar
strategy: self_audit_broker
audit_mode: sidecar
dataset: ../data/gold/selfauditbench-gold-asb.jsonl
output_root: ../artifacts/runs
random_seed: 7
fail_closed: true
model:
  provider: qwen-openai-compatible
  model: qwen3.5
  base_url: https://uni-api.cstcloud.cn/v1
  api_key_env: QWEN_API_KEY
  thinking_mode: disabled
  timeout_seconds: 300
  max_retries: 5
  temperature: 0
  max_tokens: 900
  concise_rationale_words: 80
  input_cost_per_million_tokens_usd: 
  output_cost_per_million_tokens_usd: 
