run_id: agentforesight-smoke-12-official-deepseek-sidecar
strategy: self_audit_broker
audit_mode: sidecar
dataset: ../artifacts/exploratory/agentforesight-smoke-12.jsonl
output_root: ../artifacts/runs
random_seed: 7
fail_closed: true
model:
  provider: deepseek-openai-compatible
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  thinking_mode: disabled
  timeout_seconds: 300
  max_retries: 5
  temperature: 0
  max_tokens: 900
  concise_rationale_words: 80
  input_cost_per_million_tokens_usd:
  output_cost_per_million_tokens_usd:
