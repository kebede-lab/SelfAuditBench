run_id: asb-full-gold-deepseek-sidecar
strategy: self_audit_broker
audit_mode: sidecar
dataset: ../data/gold/selfauditbench-gold-asb.jsonl
output_root: ../artifacts/runs
random_seed: 7
fail_closed: true
model:
  provider: deepseek-openai-compatible
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
