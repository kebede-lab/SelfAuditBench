run_id: live-sidecar-example
strategy: self_audit_broker
audit_mode: sidecar
dataset: ../data/smoke/scenarios.jsonl
output_root: ../artifacts/runs
random_seed: 7
fail_closed: true
model:
  provider: openai-compatible
  model: replace-with-model-name
  base_url: https://replace-with-provider-endpoint/v1
  timeout_seconds: 60
  max_retries: 2
# For combined_monitor_broker, set observer_model to a separately configured
# OpenAI-compatible observer. If omitted, the actor profile is reused.
